<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Digital Fractal Plasma</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 24px;
            color: #fff;
            width: 300px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid #4A8FDE;
        }

        #ui-panel::-webkit-scrollbar {
            width: 4px;
        }
        #ui-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #ui-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }

        #ui-panel.hidden {
            transform: translateX(-340px);
            opacity: 0;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4A8FDE;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #C43030;
            border-radius: 2px;
        }

        .section-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 20px 0 16px 0;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #C43030;
            margin-bottom: 14px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label span {
            color: #fff;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            border: 2px solid #4A8FDE;
            box-shadow: 0 0 10px rgba(74, 143, 222, 0.5);
        }

        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }

        /* Custom Palette Editor */
        #custom-palette-panel {
            margin-top: 14px;
            display: none;
        }
        #custom-palette-panel.visible {
            display: block;
        }
        .custom-palette-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .custom-palette-header label {
            margin: 0;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #customColorCount {
            width: 80px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .color-swatch-btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .color-swatch-btn:hover {
            border-color: rgba(255,255,255,0.5);
        }
        .color-swatch-btn input[type="color"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .hex-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 7px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }
        .hex-input:focus {
            border-color: rgba(74,143,222,0.6);
        }
        .palette-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .preset-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.15s;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-color: rgba(255,255,255,0.25);
        }

        .toggle-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <canvas id="plasmaCanvas"></canvas>

    <div id="ui-panel">
        <h1>System Override</h1>
        
        <div class="control-group">
            <label for="palette">Color Engine</label>
            <select id="palette">
                <option value="combined">NEON FRACTAL (Mixed)</option>
                <option value="cobalt">COBALT CORE (Blue)</option>
                <option value="crimson">CRIMSON EMBER (Red)</option>
                <option value="electric">ELECTRIC ARC (Cyan/White)</option>
                <option value="custom">CUSTOM</option>
            </select>
        </div>

        <!-- Custom Palette Editor -->
        <div id="custom-palette-panel">
            <div class="custom-palette-header">
                <label>Colors</label>
                <select id="customColorCount">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div id="color-rows"></div>
            <div class="palette-presets">
                <button class="preset-btn" data-preset="bw">B/W</button>
                <button class="preset-btn" data-preset="gameboy">GameBoy</button>
                <button class="preset-btn" data-preset="cga">CGA</button>
                <button class="preset-btn" data-preset="sepia">Sepia</button>
                <button class="preset-btn" data-preset="neon">Neon</button>
            </div>
        </div>

        <div class="control-group">
            <label for="blockSize">Block Size <span id="blockSize-val">12px</span></label>
            <input type="range" id="blockSize" min="4" max="40" step="2" value="12">
        </div>

        <div class="control-group">
            <label for="gap">Pixel Gap <span id="gap-val">1px</span></label>
            <input type="range" id="gap" min="0" max="10" step="1" value="1">
        </div>

        <div class="control-group">
            <label for="speed">Clock Speed <span id="speed-val">1.0</span></label>
            <input type="range" id="speed" min="0" max="4" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="zoom">Magnification <span id="zoom-val">1.0</span></label>
            <input type="range" id="zoom" min="0.1" max="4" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="contrast">Color Depth <span id="contrast-val">1.8</span></label>
            <input type="range" id="contrast" min="0.5" max="4" step="0.1" value="1.8">
        </div>

        <!-- DITHER CONTROLS -->
        <hr class="section-divider">
        <div class="section-label">Dither Engine</div>

        <div class="control-group">
            <label for="ditherPattern">Pattern</label>
            <select id="ditherPattern">
                <option value="none">NONE (Raw Plasma)</option>
                <option value="bayer2">BAYER 2×2</option>
                <option value="bayer4">BAYER 4×4</option>
                <option value="bayer8" selected>BAYER 8×8</option>
                <option value="halftone">HALFTONE</option>
                <option value="noise">NOISE</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherStyle">Style</label>
            <select id="ditherStyle">
                <option value="threshold">THRESHOLD</option>
                <option value="scaled">SCALED</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherShape">Shape</label>
            <select id="ditherShape">
                <option value="square">SQUARE</option>
                <option value="circle">CIRCLE</option>
                <option value="diamond">DIAMOND</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherStrength">Dither Strength <span id="ditherStrength-val">0.50</span></label>
            <input type="range" id="ditherStrength" min="0" max="1" step="0.01" value="0.50">
        </div>

        <div class="control-group">
            <label for="ditherColors">Dither Colors <span id="ditherColors-val">4</span></label>
            <input type="range" id="ditherColors" min="2" max="16" step="1" value="4">
        </div>
    </div>

    <div class="toggle-hint">Press [H] to toggle interface</div>

    <script>
        const canvas = document.getElementById('plasmaCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // =============================================
        // DITHER MATRICES (from glsl-dither / 34.svg-rain.js)
        // =============================================

        // Bayer 2×2 ordered dither matrix
        const BAYER_2x2 = [
            [0, 2],
            [3, 1]
        ]; // Normalize by / 4.0

        // Bayer 4×4 ordered dither matrix
        const BAYER_4x4 = [
            [ 0,  8,  2, 10],
            [12,  4, 14,  6],
            [ 3, 11,  1,  9],
            [15,  7, 13,  5]
        ]; // Normalize by / 16.0

        // Bayer 8×8 ordered dither matrix (same as glsl-dither/8x8 used in 34.svg-rain.js)
        const BAYER_8x8 = [
            [ 0, 48, 12, 60,  3, 51, 15, 63],
            [32, 16, 44, 28, 35, 19, 47, 31],
            [ 8, 56,  4, 52, 11, 59,  7, 55],
            [40, 24, 36, 20, 43, 27, 39, 23],
            [ 2, 50, 14, 62,  1, 49, 13, 61],
            [34, 18, 46, 30, 33, 17, 45, 29],
            [10, 58,  6, 54,  9, 57,  5, 53],
            [42, 26, 38, 22, 41, 25, 37, 21]
        ]; // Normalize by / 64.0

        // Get dither threshold from pattern type at grid position (ix, iy)
        function getDitherThreshold(ix, iy, pattern) {
            switch (pattern) {
                case 'bayer2': {
                    const n = 2;
                    return BAYER_2x2[iy % n][ix % n] / (n * n);
                }
                case 'bayer4': {
                    const n = 4;
                    return BAYER_4x4[iy % n][ix % n] / (n * n);
                }
                case 'bayer8': {
                    const n = 8;
                    return BAYER_8x8[iy % n][ix % n] / (n * n);
                }
                case 'halftone': {
                    // Radial distance from cell center within a repeating tile
                    const tileSize = 8;
                    const dx = (ix % tileSize) - tileSize / 2 + 0.5;
                    const dy = (iy % tileSize) - tileSize / 2 + 0.5;
                    const maxDist = Math.sqrt(2) * tileSize / 2;
                    return Math.sqrt(dx * dx + dy * dy) / maxDist;
                }
                case 'noise': {
                    // Pseudo-random hash based on coordinates (deterministic per frame)
                    let h = ix * 374761393 + iy * 668265263;
                    h = (h ^ (h >> 13)) * 1274126177;
                    h = h ^ (h >> 16);
                    return (h & 0xFFFF) / 65535.0;
                }
                default:
                    return 0.5;
            }
        }

        // =============================================
        // PALETTES
        // =============================================

        const hexToRgb = h => {
            const r = parseInt(h.slice(1,3), 16), g = parseInt(h.slice(3,5), 16), b = parseInt(h.slice(5,7), 16);
            return [r, g, b];
        };

        const COBALT_DEEP = ["#031438", "#07245C", "#0F3880", "#1A52A8", "#2B6FCC", "#4A8FDE", "#7BB3E8", "#AECFEE", "#FFFFFF"];
        const CRIMSON_DEEP = ["#380303", "#5C0808", "#801010", "#A31E1E", "#C43030", "#D45E5E", "#E08E8E", "#FBF0F0", "#FFFFFF"];
        const ELECTRIC = ["#000000", "#031438", "#1A52A8", "#4A8FDE", "#7BB3E8", "#FFFFFF", "#7BB3E8", "#4A8FDE"];

        const palettes = {
            cobalt: COBALT_DEEP.map(hexToRgb),
            crimson: CRIMSON_DEEP.map(hexToRgb),
            electric: ELECTRIC.map(hexToRgb),
            combined: [...COBALT_DEEP.map(hexToRgb), ...CRIMSON_DEEP.reverse().map(hexToRgb)]
        };

        // =============================================
        // STATE & CONTROLS
        // =============================================

        let config = {
            palette: palettes.combined,
            blockSize: 12,
            gap: 1,
            speed: 1.0,
            zoom: 1.0,
            contrast: 1.8,
            // Dither settings
            ditherPattern: 'bayer8',
            ditherStyle: 'threshold',
            ditherShape: 'square',
            ditherStrength: 0.50,
            ditherColors: 4
        };

        let time = 0;
        let width, height;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
        }

        window.addEventListener('resize', resize);

        // =============================================
        // COLOR FUNCTIONS
        // =============================================

        // Get raw brightness-to-color (returns [r, g, b] array)
        function getColorRGB(val) {
            // Sigmoid for that high-contrast "electric" look
            val = 1.0 / (1.0 + Math.exp(-10 * (val - 0.5) * config.contrast));
            val = Math.max(0, Math.min(0.999, val));

            const p = config.palette;
            const idx = val * (p.length - 1);
            const i1 = Math.floor(idx);
            const i2 = Math.min(i1 + 1, p.length - 1);
            const f = idx - i1;

            const c1 = p[i1], c2 = p[i2];
            return [
                c1[0] + (c2[0] - c1[0]) * f,
                c1[1] + (c2[1] - c1[1]) * f,
                c1[2] + (c2[2] - c1[2]) * f
            ];
        }

        // Quantize a 0–1 value to N levels
        function quantize(val, levels) {
            return Math.floor(val * levels) / levels;
        }

        // Get dithered color for a cell
        function getDitheredColor(brightness, ix, iy) {
            const pattern = config.ditherPattern;
            const strength = config.ditherStrength;
            const levels = config.ditherColors;

            if (pattern === 'none') {
                return getColorRGB(brightness);
            }

            // Get the pattern threshold for this cell position
            const threshold = getDitherThreshold(ix, iy, pattern);

            // Apply ordered dithering:
            // Shift brightness by the threshold, then quantize
            // This is the same concept as the GLSL line in 34.svg-rain.js:
            //   dither(gl_FragCoord.xy / resolution.xy * ditherSize, diffuse)
            const ditherOffset = (threshold - 0.5) * strength;
            const ditheredBrightness = Math.max(0, Math.min(1, brightness + ditherOffset));

            // Quantize to N color levels
            const quantized = quantize(ditheredBrightness, levels);

            return getColorRGB(quantized);
        }

        // =============================================
        // SHAPE DRAWING
        // =============================================

        function drawShape(x, y, size, shape) {
            switch (shape) {
                case 'circle':
                    ctx.beginPath();
                    ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'diamond':
                    ctx.beginPath();
                    const half = size / 2;
                    ctx.moveTo(x + half, y);
                    ctx.lineTo(x + size, y + half);
                    ctx.lineTo(x + half, y + size);
                    ctx.lineTo(x, y + half);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'square':
                default:
                    ctx.fillRect(x, y, size, size);
                    break;
            }
        }

        // =============================================
        // RENDER LOOP
        // =============================================

        function render() {
            // Clear screen
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            const z = 0.02 * config.zoom;
            const t = time;
            
            const cols = Math.ceil(width / config.blockSize);
            const rows = Math.ceil(height / config.blockSize);
            const baseSize = config.blockSize - config.gap;
            const isScaled = config.ditherStyle === 'scaled' && config.ditherPattern !== 'none';

            for (let iy = 0; iy < rows; iy++) {
                for (let ix = 0; ix < cols; ix++) {
                    const x = ix * config.blockSize;
                    const y = iy * config.blockSize;

                    // Pass 1: Compute fractal plasma brightness (existing math — untouched)
                    let v = Math.sin(ix * z + t);
                    v += Math.sin(iy * z * 1.5 + t * 0.5);
                    
                    const cx = ix + 15 * Math.sin(t/3);
                    const cy = iy + 15 * Math.cos(t/5);
                    v += Math.sin(Math.sqrt(cx*cx + cy*cy + 1) * z * 2);
                    
                    v += Math.sin((ix + iy) * z * 0.5 + t);
                    
                    v = (v + 4.0) / 8.0; // Normalize to 0–1

                    // Pass 2: Apply dither to decide color
                    const rgb = getDitheredColor(v, ix, iy);
                    ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;

                    if (isScaled) {
                        // Scaled mode: shape size proportional to brightness
                        // Brighter = larger shape (like halftone printing)
                        const scaleFactor = Math.max(0.1, v);
                        const scaledSize = baseSize * scaleFactor;
                        const offset = (baseSize - scaledSize) / 2;
                        drawShape(x + offset, y + offset, scaledSize, config.ditherShape);
                    } else {
                        // Threshold mode: full-size shapes
                        drawShape(x, y, baseSize, config.ditherShape);
                    }
                }
            }

            time += 0.04 * config.speed;
            requestAnimationFrame(render);
        }

        // =============================================
        // UI BINDING
        // =============================================

        const bind = (id, key, suffix = '') => {
            const el = document.getElementById(id);
            const display = document.getElementById(`${id}-val`);
            el.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                config[key] = val;
                if (display) display.textContent = val + suffix;
            });
        };

        bind('blockSize', 'blockSize', 'px');
        bind('gap', 'gap', 'px');
        bind('speed', 'speed');
        bind('zoom', 'zoom');
        bind('contrast', 'contrast');
        bind('ditherStrength', 'ditherStrength');
        bind('ditherColors', 'ditherColors');

        document.getElementById('palette').addEventListener('change', (e) => {
            const val = e.target.value;
            const customPanel = document.getElementById('custom-palette-panel');
            if (val === 'custom') {
                customPanel.classList.add('visible');
                config.palette = buildCustomPaletteRGB();
            } else {
                customPanel.classList.remove('visible');
                config.palette = palettes[val];
                document.getElementById('ui-panel').style.borderLeftColor = val === 'crimson' ? '#C43030' : '#4A8FDE';
            }
        });

        // =============================================
        // CUSTOM PALETTE EDITOR
        // =============================================

        const PRESETS = {
            bw:      ['#000000', '#ffffff'],
            gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
            cga:     ['#000000', '#55ffff', '#ff55ff', '#ffffff'],
            sepia:   ['#2c1a0e', '#6b3d1e', '#c8a96e', '#f2e8d5'],
            neon:    ['#0d0d0d', '#ff00cc', '#00ffcc', '#ffee00', '#ffffff']
        };

        // Stores the current custom hex colors (as strings)
        let customColors = ['#031438', '#1A52A8', '#4A8FDE', '#FFFFFF'];

        function isValidHex(h) {
            return /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(h.trim());
        }

        function normalizeHex(h) {
            h = h.trim().replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c+c).join('');
            return '#' + h.toLowerCase();
        }

        function buildCustomPaletteRGB() {
            return customColors.map(hexToRgb);
        }

        function renderColorRows() {
            const container = document.getElementById('color-rows');
            container.innerHTML = '';

            customColors.forEach((hex, i) => {
                const row = document.createElement('div');
                row.className = 'color-row';

                // Swatch (click to open color picker)
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch-btn';
                swatch.style.background = hex;

                const picker = document.createElement('input');
                picker.type = 'color';
                picker.value = hex;
                picker.addEventListener('input', (e) => {
                    customColors[i] = e.target.value;
                    swatch.style.background = e.target.value;
                    hexInputEl.value = e.target.value;
                    if (document.getElementById('palette').value === 'custom') {
                        config.palette = buildCustomPaletteRGB();
                    }
                });
                swatch.appendChild(picker);

                // Hex input
                const hexInputEl = document.createElement('input');
                hexInputEl.type = 'text';
                hexInputEl.className = 'hex-input';
                hexInputEl.value = hex;
                hexInputEl.maxLength = 7;
                hexInputEl.placeholder = '#000000';
                hexInputEl.spellcheck = false;

                hexInputEl.addEventListener('input', (e) => {
                    let raw = e.target.value.trim();
                    if (!raw.startsWith('#')) raw = '#' + raw;
                    if (isValidHex(raw)) {
                        const normalized = normalizeHex(raw);
                        customColors[i] = normalized;
                        swatch.style.background = normalized;
                        picker.value = normalized;
                        if (document.getElementById('palette').value === 'custom') {
                            config.palette = buildCustomPaletteRGB();
                        }
                    }
                });

                // Sync on blur to clean up partial hex
                hexInputEl.addEventListener('blur', (e) => {
                    e.target.value = customColors[i];
                });

                row.appendChild(swatch);
                row.appendChild(hexInputEl);
                container.appendChild(row);
            });
        }

        // Color count selector
        document.getElementById('customColorCount').addEventListener('change', (e) => {
            const newCount = parseInt(e.target.value);
            const oldCount = customColors.length;
            if (newCount > oldCount) {
                // Fill extra slots by repeating last color
                for (let i = oldCount; i < newCount; i++) {
                    customColors.push(customColors[oldCount - 1] || '#ffffff');
                }
            } else {
                customColors = customColors.slice(0, newCount);
            }
            renderColorRows();
            if (document.getElementById('palette').value === 'custom') {
                config.palette = buildCustomPaletteRGB();
            }
        });

        // Preset buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = PRESETS[btn.dataset.preset];
                if (!preset) return;
                customColors = [...preset];
                // Sync the color count selector
                const countSelect = document.getElementById('customColorCount');
                // Find closest available option
                const opts = [...countSelect.options].map(o => parseInt(o.value));
                const closest = opts.includes(preset.length) ? preset.length : opts[opts.length - 1];
                countSelect.value = closest;
                renderColorRows();
                if (document.getElementById('palette').value === 'custom') {
                    config.palette = buildCustomPaletteRGB();
                }
            });
        });

        // Initialize the color rows on page load
        renderColorRows();

        // Dither controls
        document.getElementById('ditherPattern').addEventListener('change', (e) => {
            config.ditherPattern = e.target.value;
        });
        document.getElementById('ditherStyle').addEventListener('change', (e) => {
            config.ditherStyle = e.target.value;
        });
        document.getElementById('ditherShape').addEventListener('change', (e) => {
            config.ditherShape = e.target.value;
        });


        // Toggle HUD
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                document.getElementById('ui-panel').classList.toggle('hidden');
            }
        });

        resize();
        render();

    </script>
</body>
</html>
