        function refreshPresetsUI() {
            const presets = getAllPresets();
            const keys = Object.keys(presets);
            const noHint = document.getElementById('no-presets-hint');
            const loadRow = document.getElementById('preset-load-row');
            const sel = document.getElementById('presetSelect');

            if (keys.length === 0) {
                noHint.style.display = 'block';
                loadRow.style.display = 'none';
            } else {
                noHint.style.display = 'none';
                loadRow.style.display = 'flex';
                sel.innerHTML = keys.map(k => `<option value="${k}">${k}</option>`).join('');
            }
        }

        document.getElementById('savePresetBtn').addEventListener('click', () => {
            const name = document.getElementById('presetNameInput').value.trim();
            if (!name) { document.getElementById('presetNameInput').focus(); return; }
            const presets = getAllPresets();
            presets[name] = buildPresetSnapshot();
            saveAllPresets(presets);
            refreshPresetsUI();
            document.getElementById('presetSelect').value = name;
            document.getElementById('presetNameInput').value = '';
        });

        document.getElementById('loadPresetBtn').addEventListener('click', () => {
            const name = document.getElementById('presetSelect').value;
            const presets = getAllPresets();
            if (presets[name]) applyPresetSnapshot(presets[name]);
        });

        document.getElementById('deletePresetBtn').addEventListener('click', () => {
            const name = document.getElementById('presetSelect').value;
            const presets = getAllPresets();
            delete presets[name];
            saveAllPresets(presets);
            refreshPresetsUI();
        });

        refreshPresetsUI();

        // =============================================
        // MEDIA SOURCE (Feature 4)
        // =============================================

        let sourceMode = 'fractal'; // 'fractal' | 'image' | 'video'
        let mediaReady = false;
        let sourceImage = null; // Global reference for optimized sampling

        const sourceVideo = document.getElementById('sourceVideo');
        const offscreenCanvas = document.getElementById('offscreenCanvas');
        const offCtx = offscreenCanvas.getContext('2d');
        const mediaFileInput = document.getElementById('mediaFileInput');

        function setSourceMode(mode) {
            sourceMode = mode;
            mediaReady = false;

            // Update toggle button states
            document.getElementById('srcFractal').classList.toggle('active', mode === 'fractal');
            document.getElementById('srcImage').classList.toggle('active', mode === 'image');
            document.getElementById('srcVideo').classList.toggle('active', mode === 'video');

            // Show/hide upload zone
            const uploadZone = document.getElementById('media-upload-zone');
            const videoControls = document.getElementById('video-controls');
            const fractalControls = document.getElementById('fractal-specific-controls');

            if (mode === 'fractal') {
                uploadZone.style.display = 'none';
                videoControls.classList.remove('visible');
                fractalControls.style.display = '';
                document.getElementById('fractal-type-row').style.display = '';
                sourceVideo.pause();
                document.getElementById('media-filename').style.display = 'none';
            } else {
                uploadZone.style.display = 'block';
                fractalControls.style.display = 'none';
                document.getElementById('fractal-type-row').style.display = 'none';
                const hint = document.getElementById('upload-hint');
                if (mode === 'image') {
                    hint.innerHTML = 'Drop an image here<br>or click to browse';
                    mediaFileInput.accept = 'image/*';
                    videoControls.classList.remove('visible');
                    sourceVideo.pause();
                } else {
                    hint.innerHTML = 'Drop an MP4/WebM video here<br>or click to browse';
                    mediaFileInput.accept = 'video/mp4,video/webm';
                }
            }

            // Sync video export panel if it's currently visible
            const panel = document.getElementById('video-export-settings');
            if (panel && panel.classList.contains('visible')) {
                const lenGroup = document.getElementById('video-length-group');
                const resGroup = document.getElementById('video-resolution-group');
                const hint = document.getElementById('video-export-hint');
                if (mode === 'video') {
                    lenGroup.style.display = 'none';
                    resGroup.style.display = 'none';
                    hint.innerHTML = `Exporting using original video duration and resolution.`;
                } else {
                    lenGroup.style.display = 'block';
                    resGroup.style.display = 'block';
                    hint.innerHTML = "Canvas size will adapt physically during recording to match Dimensions. Export may take time.";
                }
            }
            resize();
        }

        document.getElementById('srcFractal').addEventListener('click', () => setSourceMode('fractal'));
        document.getElementById('srcImage').addEventListener('click', () => setSourceMode('image'));
        document.getElementById('srcVideo').addEventListener('click', () => setSourceMode('video'));

        // File upload via click
        document.getElementById('media-upload-zone').addEventListener('click', () => {
            if (sourceMode !== 'fractal') mediaFileInput.click();
        });

        // Drag & drop
        document.getElementById('media-upload-zone').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('media-upload-zone').classList.add('drag-over');
        });
        document.getElementById('media-upload-zone').addEventListener('dragleave', () => {
            document.getElementById('media-upload-zone').classList.remove('drag-over');
        });
        document.getElementById('media-upload-zone').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('media-upload-zone').classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleMediaFile(file);
        });

        mediaFileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleMediaFile(e.target.files[0]);
        });

        function handleMediaFile(file) {
            const isVideo = file.type.startsWith('video/');
            const isImage = file.type.startsWith('image/');
            if (!isVideo && !isImage) return;

            const fn = document.getElementById('media-filename');
            fn.textContent = file.name;
            fn.style.display = 'block';

            const url = URL.createObjectURL(file);

            if (isImage && sourceMode === 'image') {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    mediaReady = true;
                    URL.revokeObjectURL(url);
                    resize();
                };
                sourceImage.src = url;
            } else if (isVideo && sourceMode === 'video') {
                sourceVideo.src = url;
                sourceVideo.play();
                sourceVideo.onloadeddata = () => {
                    offscreenCanvas.width = sourceVideo.videoWidth;
                    offscreenCanvas.height = sourceVideo.videoHeight;
                    mediaReady = true;
                    resize();
                };
                document.getElementById('video-controls').classList.add('visible');
            }
        }

        // Video play/pause
        document.getElementById('videoPlayPause').addEventListener('click', () => {
            const btn = document.getElementById('videoPlayPause');
            if (sourceVideo.paused) {
                sourceVideo.play();
                btn.textContent = '⏸ Pause';
            } else {
                sourceVideo.pause();
                btn.textContent = '▶ Play';
            }
        });

        // Video loop toggle
        document.getElementById('videoLoop').addEventListener('click', () => {
            sourceVideo.loop = !sourceVideo.loop;
            document.getElementById('videoLoop').textContent = `↺ Loop: ${sourceVideo.loop ? 'On' : 'Off'}`;
        });

        // Sample brightness from pre-captured media buffer at grid position (ix, iy)
        function getBrightnessFromMedia(ix, iy) {
            if (!mediaBuffer || ix >= mediaBufferWidth || iy >= mediaBufferHeight) return 0.5;
            const idx = (iy * mediaBufferWidth + ix) * 4;
            const r = mediaBuffer[idx];
            const g = mediaBuffer[idx + 1];
            const b = mediaBuffer[idx + 2];
            // Standard luminance formula: 0.299R + 0.587G + 0.114B
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        // =============================================
        // PATCH RENDER LOOP FOR MEDIA SOURCE
        // =============================================

        // Override the brightness calculation in the render loop
        // We do this by monkey-patching the render function to use media brightness
        const _origRender = render;
        let _renderPatched = false;
        if (!_renderPatched) {
            _renderPatched = true;
            // We already modified render above — the render loop will call getBrightnessFromSource
        }

        // =============================================
        // KEYBOARD SHORTCUTS
        // =============================================

        window.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'h') {
                e.preventDefault();
                document.getElementById('ui-panel').classList.toggle('hidden');
            }
        });

        resize();
        render();


    </script>
</body>
</html>
