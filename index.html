<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Digital Fractal Plasma</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 24px;
            color: #fff;
            width: 300px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid #4A8FDE;
        }

        #ui-panel::-webkit-scrollbar {
            width: 4px;
        }
        #ui-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #ui-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }

        #ui-panel.hidden {
            transform: translateX(-340px);
            opacity: 0;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4A8FDE;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #C43030;
            border-radius: 2px;
        }

        .section-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 20px 0 16px 0;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #C43030;
            margin-bottom: 14px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label span {
            color: #fff;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            border: 2px solid #4A8FDE;
            box-shadow: 0 0 10px rgba(74, 143, 222, 0.5);
        }

        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }

        /* Custom Palette Editor */
        #custom-palette-panel {
            margin-top: 14px;
            display: none;
        }
        #custom-palette-panel.visible {
            display: block;
        }
        .custom-palette-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .custom-palette-header label {
            margin: 0;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #customColorCount {
            width: 80px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .color-swatch-btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .color-swatch-btn:hover {
            border-color: rgba(255,255,255,0.5);
        }
        .color-swatch-btn input[type="color"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .hex-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 7px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }
        .hex-input:focus {
            border-color: rgba(74,143,222,0.6);
        }
        .palette-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .preset-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.15s;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-color: rgba(255,255,255,0.25);
        }

        /* Weight slider inside color rows */
        .weight-slider-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }
        .weight-slider-wrap input[type="range"] {
            flex: 1;
            height: 4px;
        }
        .weight-pct {
            font-size: 10px;
            color: #888;
            min-width: 30px;
            text-align: right;
            font-family: inherit;
        }

        /* Gradient preview bar */
        #gradient-preview {
            width: 100%;
            height: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Export section */
        .export-row {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.15s;
            text-align: center;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-color: rgba(255,255,255,0.25);
        }
        .action-btn.primary {
            background: rgba(74,143,222,0.15);
            border-color: rgba(74,143,222,0.4);
            color: #4A8FDE;
        }
        .action-btn.primary:hover {
            background: rgba(74,143,222,0.25);
            color: #7BB3E8;
        }
        .action-btn.danger {
            background: rgba(196,48,48,0.1);
            border-color: rgba(196,48,48,0.3);
            color: #C43030;
        }
        .action-btn.danger:hover {
            background: rgba(196,48,48,0.2);
        }

        /* Save / Load */
        .preset-save-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .preset-name-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 7px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            font-family: inherit;
            min-width: 0;
        }
        .preset-name-input:focus {
            border-color: rgba(74,143,222,0.5);
        }
        .preset-load-row {
            display: flex;
            gap: 8px;
        }
        .preset-load-row select {
            flex: 1;
            min-width: 0;
        }
        #no-presets-hint {
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            text-align: center;
            padding: 6px 0;
            display: none;
        }

        /* Media Source */
        .source-toggle-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .source-btn {
            flex: 1;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 7px 4px;
            border-radius: 4px;
            font-size: 10px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.15s;
            text-align: center;
        }
        .source-btn.active {
            background: rgba(74,143,222,0.2);
            color: #fff;
            border-color: rgba(74,143,222,0.5);
        }
        #media-upload-zone {
            display: none;
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 10px;
        }
        #media-upload-zone:hover, #media-upload-zone.drag-over {
            border-color: rgba(74,143,222,0.6);
        }
        #media-upload-zone p {
            margin: 0 0 8px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            line-height: 1.5;
        }
        #media-upload-zone .upload-icon {
            font-size: 22px;
            margin-bottom: 6px;
        }
        #media-filename {
            font-size: 10px;
            color: #4A8FDE;
            margin-top: 4px;
            word-break: break-all;
            display: none;
        }
        #video-controls {
            display: none;
            gap: 8px;
            margin-top: 8px;
        }
        #video-controls.visible {
            display: flex;
        }
        .toggle-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <canvas id="plasmaCanvas"></canvas>

    <div id="ui-panel">
        <h1>System Override</h1>

        <!-- SOURCE MODE -->
        <hr class="section-divider" style="margin-top:0">
        <div class="section-label">Source</div>
        <div class="source-toggle-row">
            <button class="source-btn active" id="srcFractal">⬡ Fractal</button>
            <button class="source-btn" id="srcImage">🖼 Image</button>
            <button class="source-btn" id="srcVideo">▶︎ Video</button>
        </div>
        <div id="media-upload-zone">
            <div class="upload-icon">⬆</div>
            <p id="upload-hint">Drop an image or video here<br>or click to browse</p>
            <div id="media-filename"></div>
        </div>
        <div id="video-controls">
            <button class="action-btn" id="videoPlayPause">⏸ Pause</button>
            <button class="action-btn" id="videoLoop">↺ Loop: On</button>
        </div>

        <hr class="section-divider">
        <div class="section-label">Color Engine</div>
            <select id="palette">
                <option value="combined">NEON FRACTAL (Mixed)</option>
                <option value="cobalt">COBALT CORE (Blue)</option>
                <option value="crimson">CRIMSON EMBER (Red)</option>
                <option value="electric">ELECTRIC ARC (Cyan/White)</option>
                <option value="custom">CUSTOM</option>
            </select>
        </div>

        <!-- Custom Palette Editor -->
        <div id="custom-palette-panel">
            <div class="custom-palette-header">
                <label>Colors</label>
                <select id="customColorCount">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div id="color-rows"></div>
            <div class="palette-presets">
                <button class="preset-btn" data-preset="bw">B/W</button>
                <button class="preset-btn" data-preset="gameboy">GameBoy</button>
                <button class="preset-btn" data-preset="cga">CGA</button>
                <button class="preset-btn" data-preset="sepia">Sepia</button>
                <button class="preset-btn" data-preset="neon">Neon</button>
            </div>
        </div>

        <div id="fractal-only-controls">
        <div class="control-group">
            <label for="blockSize">Block Size <span id="blockSize-val">12px</span></label>
            <input type="range" id="blockSize" min="4" max="40" step="2" value="12">
        </div>

        <div class="control-group">
            <label for="gap">Pixel Gap <span id="gap-val">1px</span></label>
            <input type="range" id="gap" min="0" max="10" step="1" value="1">
        </div>

        <div class="control-group">
            <label for="speed">Clock Speed <span id="speed-val">1.0</span></label>
            <input type="range" id="speed" min="0" max="4" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="zoom">Magnification <span id="zoom-val">1.0</span></label>
            <input type="range" id="zoom" min="0.1" max="4" step="0.1" value="1.0">
        </div>
        </div><!-- /fractal-only-controls -->

        <div class="control-group">
            <label for="contrast">Color Depth <span id="contrast-val">1.8</span></label>
            <input type="range" id="contrast" min="0.5" max="4" step="0.1" value="1.8">
        </div>

        <!-- DITHER CONTROLS -->
        <hr class="section-divider">
        <div class="section-label">Dither Engine</div>

        <div class="control-group">
            <label for="ditherPattern">Pattern</label>
            <select id="ditherPattern">
                <option value="none">NONE (Raw Plasma)</option>
                <option value="bayer2">BAYER 2×2</option>
                <option value="bayer4">BAYER 4×4</option>
                <option value="bayer8" selected>BAYER 8×8</option>
                <option value="halftone">HALFTONE</option>
                <option value="noise">NOISE</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherStyle">Style</label>
            <select id="ditherStyle">
                <option value="threshold">THRESHOLD</option>
                <option value="scaled">SCALED</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherShape">Shape</label>
            <select id="ditherShape">
                <option value="square">SQUARE</option>
                <option value="circle">CIRCLE</option>
                <option value="diamond">DIAMOND</option>
            </select>
        </div>

        <div class="control-group">
            <label for="ditherStrength">Dither Strength <span id="ditherStrength-val">0.50</span></label>
            <input type="range" id="ditherStrength" min="0" max="1" step="0.01" value="0.50">
        </div>

        <div class="control-group">
            <label for="ditherColors">Dither Colors <span id="ditherColors-val">4</span></label>
            <input type="range" id="ditherColors" min="2" max="16" step="1" value="4">
        </div>

        <!-- EXPORT -->
        <hr class="section-divider">
        <div class="section-label">Export</div>
        <div class="export-row">
            <button class="action-btn primary" id="exportPng">⬇ PNG</button>
            <button class="action-btn primary" id="exportSvg">⬇ SVG</button>
        </div>

        <!-- SAVE / LOAD -->
        <hr class="section-divider">
        <div class="section-label">Presets</div>
        <div class="preset-save-row">
            <input type="text" class="preset-name-input" id="presetNameInput" placeholder="Preset name…">
            <button class="action-btn primary" id="savePresetBtn">💾 Save</button>
        </div>
        <div id="no-presets-hint">No saved presets yet</div>
        <div class="preset-load-row" id="preset-load-row" style="display:none">
            <select id="presetSelect"></select>
            <button class="action-btn" id="loadPresetBtn">Load</button>
            <button class="action-btn danger" id="deletePresetBtn">✕</button>
        </div>
    </div>

    <div class="toggle-hint">Press [H] to toggle interface</div>

    <!-- Hidden elements for media source feature -->
    <input type="file" id="mediaFileInput" accept="image/*,video/mp4,video/webm" style="display:none">
    <video id="sourceVideo" style="display:none" playsinline loop></video>
    <canvas id="offscreenCanvas" style="display:none"></canvas>

    <script>
        const canvas = document.getElementById('plasmaCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // =============================================
        // DITHER MATRICES (from glsl-dither / 34.svg-rain.js)
        // =============================================

        // Bayer 2×2 ordered dither matrix
        const BAYER_2x2 = [
            [0, 2],
            [3, 1]
        ]; // Normalize by / 4.0

        // Bayer 4×4 ordered dither matrix
        const BAYER_4x4 = [
            [ 0,  8,  2, 10],
            [12,  4, 14,  6],
            [ 3, 11,  1,  9],
            [15,  7, 13,  5]
        ]; // Normalize by / 16.0

        // Bayer 8×8 ordered dither matrix (same as glsl-dither/8x8 used in 34.svg-rain.js)
        const BAYER_8x8 = [
            [ 0, 48, 12, 60,  3, 51, 15, 63],
            [32, 16, 44, 28, 35, 19, 47, 31],
            [ 8, 56,  4, 52, 11, 59,  7, 55],
            [40, 24, 36, 20, 43, 27, 39, 23],
            [ 2, 50, 14, 62,  1, 49, 13, 61],
            [34, 18, 46, 30, 33, 17, 45, 29],
            [10, 58,  6, 54,  9, 57,  5, 53],
            [42, 26, 38, 22, 41, 25, 37, 21]
        ]; // Normalize by / 64.0

        // Get dither threshold from pattern type at grid position (ix, iy)
        function getDitherThreshold(ix, iy, pattern) {
            switch (pattern) {
                case 'bayer2': {
                    const n = 2;
                    return BAYER_2x2[iy % n][ix % n] / (n * n);
                }
                case 'bayer4': {
                    const n = 4;
                    return BAYER_4x4[iy % n][ix % n] / (n * n);
                }
                case 'bayer8': {
                    const n = 8;
                    return BAYER_8x8[iy % n][ix % n] / (n * n);
                }
                case 'halftone': {
                    // Radial distance from cell center within a repeating tile
                    const tileSize = 8;
                    const dx = (ix % tileSize) - tileSize / 2 + 0.5;
                    const dy = (iy % tileSize) - tileSize / 2 + 0.5;
                    const maxDist = Math.sqrt(2) * tileSize / 2;
                    return Math.sqrt(dx * dx + dy * dy) / maxDist;
                }
                case 'noise': {
                    // Pseudo-random hash based on coordinates (deterministic per frame)
                    let h = ix * 374761393 + iy * 668265263;
                    h = (h ^ (h >> 13)) * 1274126177;
                    h = h ^ (h >> 16);
                    return (h & 0xFFFF) / 65535.0;
                }
                default:
                    return 0.5;
            }
        }

        // =============================================
        // PALETTES
        // =============================================

        const hexToRgb = h => {
            const r = parseInt(h.slice(1,3), 16), g = parseInt(h.slice(3,5), 16), b = parseInt(h.slice(5,7), 16);
            return [r, g, b];
        };

        const COBALT_DEEP = ["#031438", "#07245C", "#0F3880", "#1A52A8", "#2B6FCC", "#4A8FDE", "#7BB3E8", "#AECFEE", "#FFFFFF"];
        const CRIMSON_DEEP = ["#380303", "#5C0808", "#801010", "#A31E1E", "#C43030", "#D45E5E", "#E08E8E", "#FBF0F0", "#FFFFFF"];
        const ELECTRIC = ["#000000", "#031438", "#1A52A8", "#4A8FDE", "#7BB3E8", "#FFFFFF", "#7BB3E8", "#4A8FDE"];

        const palettes = {
            cobalt: COBALT_DEEP.map(hexToRgb),
            crimson: CRIMSON_DEEP.map(hexToRgb),
            electric: ELECTRIC.map(hexToRgb),
            combined: [...COBALT_DEEP.map(hexToRgb), ...CRIMSON_DEEP.reverse().map(hexToRgb)]
        };

        // =============================================
        // STATE & CONTROLS
        // =============================================

        let config = {
            palette: palettes.combined,
            blockSize: 12,
            gap: 1,
            speed: 1.0,
            zoom: 1.0,
            contrast: 1.8,
            // Dither settings
            ditherPattern: 'bayer8',
            ditherStyle: 'threshold',
            ditherShape: 'square',
            ditherStrength: 0.50,
            ditherColors: 4
        };

        let time = 0;
        let width, height;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
        }

        window.addEventListener('resize', resize);

        // =============================================
        // COLOR FUNCTIONS
        // =============================================

        // Get raw brightness-to-color (returns [r, g, b] array)
        function getColorRGB(val) {
            // Sigmoid for that high-contrast "electric" look
            val = 1.0 / (1.0 + Math.exp(-10 * (val - 0.5) * config.contrast));
            val = Math.max(0, Math.min(0.999, val));

            const p = config.palette;
            const idx = val * (p.length - 1);
            const i1 = Math.floor(idx);
            const i2 = Math.min(i1 + 1, p.length - 1);
            const f = idx - i1;

            const c1 = p[i1], c2 = p[i2];
            return [
                c1[0] + (c2[0] - c1[0]) * f,
                c1[1] + (c2[1] - c1[1]) * f,
                c1[2] + (c2[2] - c1[2]) * f
            ];
        }

        // Quantize a 0–1 value to N levels
        function quantize(val, levels) {
            return Math.floor(val * levels) / levels;
        }

        // Get dithered color for a cell
        function getDitheredColor(brightness, ix, iy) {
            const pattern = config.ditherPattern;
            const strength = config.ditherStrength;
            const levels = config.ditherColors;

            if (pattern === 'none') {
                return getColorRGB(brightness);
            }

            // Get the pattern threshold for this cell position
            const threshold = getDitherThreshold(ix, iy, pattern);

            // Apply ordered dithering:
            // Shift brightness by the threshold, then quantize
            // This is the same concept as the GLSL line in 34.svg-rain.js:
            //   dither(gl_FragCoord.xy / resolution.xy * ditherSize, diffuse)
            const ditherOffset = (threshold - 0.5) * strength;
            const ditheredBrightness = Math.max(0, Math.min(1, brightness + ditherOffset));

            // Quantize to N color levels
            const quantized = quantize(ditheredBrightness, levels);

            return getColorRGB(quantized);
        }

        // =============================================
        // SHAPE DRAWING
        // =============================================

        function drawShape(x, y, size, shape) {
            switch (shape) {
                case 'circle':
                    ctx.beginPath();
                    ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'diamond':
                    ctx.beginPath();
                    const half = size / 2;
                    ctx.moveTo(x + half, y);
                    ctx.lineTo(x + size, y + half);
                    ctx.lineTo(x + half, y + size);
                    ctx.lineTo(x, y + half);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'square':
                default:
                    ctx.fillRect(x, y, size, size);
                    break;
            }
        }

        // =============================================
        // RENDER LOOP
        // =============================================

        function render() {
            // Clear screen
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            const z = 0.02 * config.zoom;
            const t = time;
            
            const cols = Math.ceil(width / config.blockSize);
            const rows = Math.ceil(height / config.blockSize);
            const baseSize = config.blockSize - config.gap;
            const isScaled = config.ditherStyle === 'scaled' && config.ditherPattern !== 'none';

            for (let iy = 0; iy < rows; iy++) {
                for (let ix = 0; ix < cols; ix++) {
                    const x = ix * config.blockSize;
                    const y = iy * config.blockSize;

                    // Pass 1: Brightness source — fractal or uploaded media
                    let v;
                    if (typeof sourceMode !== 'undefined' && sourceMode !== 'fractal' && typeof mediaReady !== 'undefined' && mediaReady) {
                        v = getBrightnessFromMedia(ix, iy);
                    } else {
                        v = Math.sin(ix * z + t);
                        v += Math.sin(iy * z * 1.5 + t * 0.5);
                        const cx = ix + 15 * Math.sin(t/3);
                        const cy = iy + 15 * Math.cos(t/5);
                        v += Math.sin(Math.sqrt(cx*cx + cy*cy + 1) * z * 2);
                        v += Math.sin((ix + iy) * z * 0.5 + t);
                        v = (v + 4.0) / 8.0; // Normalize to 0–1
                    }


                    // Pass 2: Apply dither to decide color
                    const rgb = getDitheredColor(v, ix, iy);
                    ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;

                    if (isScaled) {
                        // Scaled mode: shape size proportional to brightness
                        // Brighter = larger shape (like halftone printing)
                        const scaleFactor = Math.max(0.1, v);
                        const scaledSize = baseSize * scaleFactor;
                        const offset = (baseSize - scaledSize) / 2;
                        drawShape(x + offset, y + offset, scaledSize, config.ditherShape);
                    } else {
                        // Threshold mode: full-size shapes
                        drawShape(x, y, baseSize, config.ditherShape);
                    }
                }
            }

            time += 0.04 * config.speed;
            requestAnimationFrame(render);
        }

        const bind = (id, key, suffix = '') => {

        // CUSTOM PALETTE EDITOR
        // =============================================

        const PALETTE_PRESETS = {
            bw:      ['#000000', '#ffffff'],
            gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
            cga:     ['#000000', '#55ffff', '#ff55ff', '#ffffff'],
            sepia:   ['#2c1a0e', '#6b3d1e', '#c8a96e', '#f2e8d5'],
            neon:    ['#0d0d0d', '#ff00cc', '#00ffcc', '#ffee00', '#ffffff']
        };

        let customColors = ['#031438', '#1A52A8', '#4A8FDE', '#FFFFFF'];
        let colorWeights = [25, 25, 25, 25]; // percentages, always sum to 100

        function isValidHex(h) {
            return /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(h.trim());
        }
        function normalizeHex(h) {
            h = h.trim().replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c+c).join('');
            return '#' + h.toLowerCase();
        }

        // Build palette from custom colors + weights using a 256-entry LUT
        function buildCustomPaletteRGB() {
            const N = 256;
            const lut = [];
            const n = customColors.length;
            const totalWeight = colorWeights.reduce((a, b) => a + b, 0) || 1;
            const normalizedWeights = colorWeights.map(w => w / totalWeight);

            // Build cumulative stop positions
            const stops = [0];
            for (let i = 0; i < n; i++) {
                stops.push(stops[i] + normalizedWeights[i]);
            }

            for (let i = 0; i < N; i++) {
                const t = i / (N - 1);
                // Find which segment we're in
                let seg = 0;
                for (let s = 0; s < n - 1; s++) {
                    if (t >= stops[s] && t <= stops[s + 1]) {
                        seg = s;
                        break;
                    }
                    if (t > stops[s + 1]) seg = s + 1;
                }
                seg = Math.min(seg, n - 2);
                const span = stops[seg + 1] - stops[seg];
                const f = span > 0 ? (t - stops[seg]) / span : 0;
                const c1 = hexToRgb(customColors[seg]);
                const c2 = hexToRgb(customColors[Math.min(seg + 1, n - 1)]);
                lut.push([
                    c1[0] + (c2[0] - c1[0]) * f,
                    c1[1] + (c2[1] - c1[1]) * f,
                    c1[2] + (c2[2] - c1[2]) * f
                ]);
            }
            return lut;
        }

        function updateGradientPreview() {
            const preview = document.getElementById('gradient-preview');
            if (!preview) return;
            const stops = customColors.map((hex, i) => {
                const totalWeight = colorWeights.reduce((a, b) => a + b, 0) || 1;
                const pct = colorWeights.slice(0, i).reduce((a, b) => a + b, 0) / totalWeight * 100;
                return `${hex} ${pct.toFixed(1)}%`;
            }).join(', ');
            preview.style.background = `linear-gradient(to right, ${stops}, ${customColors[customColors.length - 1]} 100%)`;
        }

        function syncWeights() {
            // Normalize weights so they sum to 100
            const total = colorWeights.reduce((a, b) => a + b, 0) || 1;
            colorWeights = colorWeights.map(w => Math.round(w / total * 100));
            // Fix rounding drift
            const diff = 100 - colorWeights.reduce((a, b) => a + b, 0);
            if (diff !== 0) colorWeights[colorWeights.length - 1] += diff;
        }

        function equalWeights(n) {
            const base = Math.floor(100 / n);
            const rem = 100 - base * n;
            return Array.from({ length: n }, (_, i) => base + (i === n - 1 ? rem : 0));
        }

        function getWeightsUI() {

        document.getElementById('customColorCount').addEventListener('change', (e) => {
            const newCount = parseInt(e.target.value);

            // Use setTimeout to let the UI update before the (potentially slow) loop
            setTimeout(() => {
                const w = canvas.width, h = canvas.height;
                const blockSize = config.blockSize;
                const cols = Math.ceil(w / blockSize);
                const rows = Math.ceil(h / blockSize);
                const baseSize = blockSize - config.gap;
                const isScaled = config.ditherStyle === 'scaled' && config.ditherPattern !== 'none';
                const z = 0.02 * config.zoom;
                const t = time;

                let shapes = '';

                for (let iy = 0; iy < rows; iy++) {
                    for (let ix = 0; ix < cols; ix++) {
                        const x = ix * blockSize;
                        const y = iy * blockSize;

                        let v;
                        if (sourceMode !== 'fractal' && mediaReady) {
                            v = getBrightnessFromMedia(ix, iy);
                        } else {
                            v = Math.sin(ix * z + t);
                            v += Math.sin(iy * z * 1.5 + t * 0.5);
                            const cx = ix + 15 * Math.sin(t/3);
                            const cy = iy + 15 * Math.cos(t/5);
                            v += Math.sin(Math.sqrt(cx*cx + cy*cy + 1) * z * 2);
                            v += Math.sin((ix + iy) * z * 0.5 + t);
                            v = (v + 4.0) / 8.0;
                        }

                        const rgb = getDitheredColor(v, ix, iy);
                        const fill = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;

                        let shapeEl = '';
                        if (isScaled) {
                            const scaleFactor = Math.max(0.1, v);
                            const sz = baseSize * scaleFactor;
                            const off = (baseSize - sz) / 2;
                            const sx = x + off, sy = y + off;
                            if (config.ditherShape === 'circle') {
                                shapeEl = `<circle cx="${(sx + sz/2).toFixed(1)}" cy="${(sy + sz/2).toFixed(1)}" r="${(sz/2).toFixed(1)}" fill="${fill}"/>`;
                            } else if (config.ditherShape === 'diamond') {
                                const hx = sx + sz/2, hy = sy + sz/2;
                                shapeEl = `<polygon points="${hx.toFixed(1)},${sy.toFixed(1)} ${(sx+sz).toFixed(1)},${hy.toFixed(1)} ${hx.toFixed(1)},${(sy+sz).toFixed(1)} ${sx.toFixed(1)},${hy.toFixed(1)}" fill="${fill}"/>`;
                            } else {
                                shapeEl = `<rect x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" fill="${fill}"/>`;
                            }
                        } else {
                            if (config.ditherShape === 'circle') {
                                shapeEl = `<circle cx="${(x+baseSize/2).toFixed(1)}" cy="${(y+baseSize/2).toFixed(1)}" r="${(baseSize/2).toFixed(1)}" fill="${fill}"/>`;
                            } else if (config.ditherShape === 'diamond') {
                                const hx = x + baseSize/2, hy = y + baseSize/2;
                                shapeEl = `<polygon points="${hx.toFixed(1)},${y.toFixed(1)} ${(x+baseSize).toFixed(1)},${hy.toFixed(1)} ${hx.toFixed(1)},${(y+baseSize).toFixed(1)} ${x.toFixed(1)},${hy.toFixed(1)}" fill="${fill}"/>`;
                            } else {
                                shapeEl = `<rect x="${x}" y="${y}" width="${baseSize}" height="${baseSize}" fill="${fill}"/>`;
                            }
                        }
                        shapes += shapeEl + '\n';
                    }
                }

                const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <rect width="${w}" height="${h}" fill="#050508"/>
${shapes}</svg>`;

                const blob = new Blob([svg], { type: 'image/svg+xml' });

        // =============================================

        function buildPresetSnapshot() {
            return {
                paletteKey: document.getElementById('palette').value,
                customColors: [...customColors],

                blockSize: config.blockSize,

                ditherStrength: config.ditherStrength,

        }

        function applyPresetSnapshot(snap) {

        function handleMediaFile(file) {
            const isVideo = file.type.startsWith('video/');
            const isImage = file.type.startsWith('image/');
            if (!isVideo && !isImage) return;

            const fn = document.getElementById('media-filename');
            fn.textContent = file.name;
            fn.style.display = 'block';

            const url = URL.createObjectURL(file);

            if (isImage && sourceMode === 'image') {
                const img = new Image();
                img.onload = () => {
                    offscreenCanvas.width = img.width;
                    offscreenCanvas.height = img.height;
                    offCtx.drawImage(img, 0, 0);
                    mediaReady = true;
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            } else if (isVideo && sourceMode === 'video') {
                sourceVideo.src = url;
                sourceVideo.play();
                sourceVideo.onloadeddata = () => {
                    offscreenCanvas.width = sourceVideo.videoWidth;
                    offscreenCanvas.height = sourceVideo.videoHeight;
                    mediaReady = true;
                };
                document.getElementById('video-controls').classList.add('visible');
            }
        }

        // Video play/pause
        document.getElementById('videoPlayPause').addEventListener('click', () => {
            const btn = document.getElementById('videoPlayPause');
            if (sourceVideo.paused) {
                sourceVideo.play();
                btn.textContent = '⏸ Pause';
            } else {
                sourceVideo.pause();
                btn.textContent = '▶ Play';
            }
        });

        // Video loop toggle
        document.getElementById('videoLoop').addEventListener('click', () => {
            sourceVideo.loop = !sourceVideo.loop;
            document.getElementById('videoLoop').textContent = `↺ Loop: ${sourceVideo.loop ? 'On' : 'Off'}`;
        });

        // Sample brightness from media at grid position (ix, iy)
        function getBrightnessFromMedia(ix, iy) {
            if (!mediaReady) return 0.5;
            // For video: draw current frame
            if (sourceMode === 'video' && !sourceVideo.paused) {
                offCtx.drawImage(sourceVideo, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
            }
            // Map grid cell to media pixel
            const px = Math.floor((ix / Math.ceil(canvas.width / config.blockSize)) * offscreenCanvas.width);
            const py = Math.floor((iy / Math.ceil(canvas.height / config.blockSize)) * offscreenCanvas.height);
            const px2 = Math.max(0, Math.min(offscreenCanvas.width - 1, px));
            const py2 = Math.max(0, Math.min(offscreenCanvas.height - 1, py));
            try {
                const pixel = offCtx.getImageData(px2, py2, 1, 1).data;
                return (0.299 * pixel[0] + 0.587 * pixel[1] + 0.114 * pixel[2]) / 255;
            } catch {
                return 0.5;
            }
        }

        // =============================================
        // PATCH RENDER LOOP FOR MEDIA SOURCE
        // =============================================

        // Override the brightness calculation in the render loop
        // We do this by monkey-patching the render function to use media brightness
        const _origRender = render;
        let _renderPatched = false;
        if (!_renderPatched) {
            _renderPatched = true;
            // We already modified render above — the render loop will call getBrightnessFromSource
        }

        // =============================================
        // KEYBOARD SHORTCUTS
        // =============================================

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                document.getElementById('ui-panel').classList.toggle('hidden');
            }
        });

        resize();
        render();


    </script>
</body>
</html>
